name: Gunluk Qizil Qiymeti (CBAR)

on:
  schedule:
    - cron: '0 13 * * *'  # Bakı vaxtı ilə 17:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Kodları yüklə (Checkout)
        uses: actions/checkout@v4 # v3-dən v4-ə qaldırıldı

      - name: Python-u hazırla
        uses: actions/setup-python@v5 # v4-dən v5-ə qaldırıldı
        with:
          python-version: '3.12' # 3.9-dan 3.12-yə qaldırıldı

      - name: Kitabxanaları yüklə
        run: |
          pip install -r requirements.txt

      - name: Skripti işlət
        run: python main.py

      - name: Dəyişiklikləri yadda saxla (Commit & Push)
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add CBAR_Gold_Rates.xlsx
          git commit -m "Excel yeniləndi: $(date +'%Y-%m-%d')" || exit 0
          git push
